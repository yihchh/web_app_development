{% extends "base.html" %}

{% block title %}首頁 - 任務管理系統{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <!-- 新增任務表單 -->
        <div class="card shadow-sm mb-4 border-0">
            <div class="card-body p-4">
                <h4 class="card-title mb-4 fw-bold">新增待辦事項</h4>
                <form action="{{ url_for('tasks.create') }}" method="POST" class="row g-3">
                    <div class="col-sm-9">
                        <input type="text" name="title" class="form-control form-control-lg border-2" placeholder="今天要做什麼？" required autofocus>
                    </div>
                    <div class="col-sm-3">
                        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">
                            <i class="bi bi-plus-lg me-1"></i>新增
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 篩選器 -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h5 class="mb-0 fw-bold">任務列表</h5>
            <div class="btn-group shadow-sm" role="group">
                <a href="{{ url_for('tasks.index', status='all') }}" 
                   class="btn btn-outline-secondary {% if current_status == 'all' %}active{% endif %}">全部</a>
                <a href="{{ url_for('tasks.index', status='pending') }}" 
                   class="btn btn-outline-secondary {% if current_status == 'pending' %}active{% endif %}">未完成</a>
                <a href="{{ url_for('tasks.index', status='done') }}" 
                   class="btn btn-outline-secondary {% if current_status == 'done' %}active{% endif %}">已完成</a>
            </div>
        </div>

        <!-- 任務列表 -->
        {% if tasks %}
            <div class="list-group shadow-sm">
                {% for task in tasks %}
                    <div class="list-group-item list-group-item-action d-flex justify-content-between align-items-center p-3 border-start-0 border-end-0">
                        <div class="d-flex align-items-center">
                            <form action="{{ url_for('tasks.toggle', task_id=task.id) }}" method="POST" class="me-3">
                                <button type="submit" class="btn btn-link p-0 text-decoration-none">
                                    {% if task.is_done %}
                                        <i class="bi bi-check-circle-fill text-success fs-3"></i>
                                    {% else %}
                                        <i class="bi bi-circle text-muted fs-3"></i>
                                    {% endif %}
                                </button>
                            </form>
                            <span class="fs-5 {% if task.is_done %}text-decoration-line-through text-muted{% endif %}">
                                {{ task.title }}
                            </span>
                        </div>
                        
                        <form action="{{ url_for('tasks.toggle', task_id=task.id) }}" method="POST" onsubmit="return confirm('確定要刪除此任務嗎？')">
                            <!-- 注意：這裡原本應該是 delete 路由，修正一下 -->
                        </form>
                        
                        <!-- 修正後的刪除按鈕 -->
                        <form action="{{ url_for('tasks.delete', task_id=task.id) }}" method="POST" onsubmit="return confirm('確定要刪除此任務嗎？')">
                            <button type="submit" class="btn btn-outline-danger btn-sm border-0">
                                <i class="bi bi-trash3"></i>
                            </button>
                        </form>
                    </div>
                {% endfor %}
            </div>
        {% else %}
            <div class="text-center py-5 bg-light rounded-3 shadow-sm">
                <i class="bi bi-clipboard2-check text-muted" style="font-size: 4rem;"></i>
                <p class="mt-3 fs-5 text-muted">目前沒有任何任務，快去新增一個吧！</p>
            </div>
        {% endif %}
    </div>
</div>
{% endblock %}
